name: broker-conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A pull request is docs-only only when every changed path is a root README or lives under
  # docs/ or docs-site/. Empty, mixed, unknown and non-pull-request comparisons fail closed to
  # full CI. The planner is a repository script so its regression test exercises this exact path.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test CI routing
        run: scripts/ci-plan_test.sh
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-plan.sh "$EVENT" "$BASE"

  # The docs checked against the code (internal/docsclaims: every command, flag, variable, key,
  # route, socket method, tool and service is named in docs-site; the counts the pages state are
  # the catalogue's), generated pages, and the published docs build. This is the only substantive
  # suite that runs for docs-only pull requests.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Astro 7 needs Node 22.23.4 or newer; a runner's cached 22 can be older.
          node-version: 24
      - name: Docs name the surface, and state the catalogue's counts
        run: go test ./internal/docsclaims/ ./scripts/docs-touched/
      - name: Generated pages match docs/
        run: scripts/sync-docs.sh --check
      - name: Build the docs site
        working-directory: docs-site
        run: npm ci --no-audit --no-fund && npm run build

  sites:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Astro 7 needs Node 22.23.4 or newer; a runner's cached 22 can be older.
          node-version: 24
      - name: Build the landing page
        working-directory: landing
        run: npm ci --no-audit --no-fund && npm run build

  broker:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: https://data.forgejo.org/actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test broker and protocol boundaries
        run: go test -race -p 1 ./...
      # Built from source at an exact version with the module's Go, so it understands that Go;
      # scripts/lint-go refuses any other version and holds the per-linter counts in
      # scripts/lint-go/baseline.json (docs/code-quality.md).
      - name: Install golangci-lint
        run: GOBIN="$PWD/.bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint (ratchet)
        run: go run ./scripts/lint-go

  check:
    needs: [changes, docs, sites, broker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      DOCS_RESULT: ${{ needs.docs.result }}
      SITES_RESULT: ${{ needs.sites.result }}
      BROKER_RESULT: ${{ needs.broker.result }}
      FULL: ${{ needs.changes.outputs.full }}
    steps:
      - name: Require the selected suites
        run: |
          test "$CHANGES_RESULT" = success
          test "$DOCS_RESULT" = success
          if [ "$FULL" = true ]; then
            test "$SITES_RESULT" = success
            test "$BROKER_RESULT" = success
          else
            test "$FULL" = false
            test "$SITES_RESULT" = skipped
            test "$BROKER_RESULT" = skipped
          fi

  claude-triage:
    # Shared kit fragment (claude-ci), Forgejo Actions: the last job of the product's CI
    # workflow, because Forgejo has no workflow_run event. Paste it under `jobs:` and list every
    # other job of the workflow in `needs:`; the rest must stay identical to the master.
    # When a pull request's run fails, Claude reads the failed jobs' log tails and posts or
    # updates one comment: likely flaky or likely real, the most likely cause, three lines.
    # Read-only and a no-op until the repository has a CLAUDE_CI_API_KEY secret. It checks out
    # nothing: the script comes from the base branch and the logs through the API. Forks get
    # no secrets and skip. On a GitHub mirror of the product it does nothing.
    needs: [changes, docs, sites, broker, check]
    if: failure() && github.event_name == 'pull_request' && github.server_url != 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Is a key set
        id: gate
        env:
          KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::skipped: no CLAUDE_CI_API_KEY"
            echo "on=false" >> "$GITHUB_OUTPUT"
          else
            echo "on=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch the triage script from the base branch
        id: kit
        if: steps.gate.outputs.on == 'true'
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.server_url }}/api/v1
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/claude-ci.mjs" -w '%{http_code}' \
            -H "Authorization: token $TOKEN" \
            "$API/repos/$REPO/raw/.github/claude/claude-ci.mjs?ref=$BASE" || true)
          if [ "$code" = 200 ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::skipped: the base branch has no .github/claude/claude-ci.mjs (HTTP $code)"
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Triage
        if: steps.kit.outputs.on == 'true'
        continue-on-error: true
        timeout-minutes: 8
        env:
          CLAUDE_CI_API_KEY: ${{ secrets.CLAUDE_CI_API_KEY }}
          CLAUDE_CI_MODEL: ${{ vars.CLAUDE_CI_MODEL }}
          CLAUDE_CI_BASE_URL: ${{ vars.CLAUDE_CI_BASE_URL }}
          CI_HOST: forgejo
          CI_API_URL: ${{ github.server_url }}/api/v1
          CI_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          CI_PR: ${{ github.event.pull_request.number }}
          CI_RUN_ID: ${{ github.run_id }}
        run: node "$RUNNER_TEMP/claude-ci.mjs" triage
