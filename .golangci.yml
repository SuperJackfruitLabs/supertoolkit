# golangci-lint v2, pinned in CI and in scripts/lint-go (see docs/code-quality.md).
# Findings that exist today are counted per linter in scripts/lint-go/baseline.json; a count may
# fall, never rise.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - nilerr
    - noctx
    - staticcheck
    - unconvert
    - unused
  # revive and gocritic are left off: almost all of what they report is style (exported-symbol
  # comments, unused parameters on interface methods), not defects.
  settings:
    gosec:
      excludes:
        # Unchecked errors are errcheck's, which applies the exclusion presets below; G104 would
        # count every one of them a second time. Every other gosec rule stays on: this is a
        # credential broker, and its findings are held by the baseline rather than switched off.
        - G104
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
